name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web/dist
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: calendar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://calendar:test-only-password@localhost:5432/calendar_test
      - run: pip-audit -r requirements.txt --disable-pip --no-deps
  deployment-package:
    needs: [web, python]
    runs-on: ubuntu-latest
    env:
      VERCEL: '1'
      DATABASE_URL: postgresql://calendar:test-only-password@localhost:5432/calendar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web/dist
      - run: uv run --locked --no-dev python scripts/prepare_static.py
      - run: uv run --locked --no-dev python -m scripts.check_runtime
      - run: uv run --locked --no-dev python -m scripts.check_deployment
