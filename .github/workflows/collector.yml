name: Collect VK events
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Постов на сообщество (1–1000)'
        default: '50'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-vk-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Collect posts into production database
        run: python -m collector.run --limit "$COLLECT_LIMIT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_API_VERSION: '5.199'
          COLLECT_LIMIT: ${{ inputs.limit || '50' }}
