[project]
name = "tpu-event-calendar"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "psycopg2-binary==2.9.13",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api.main:app"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv-deploy", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

